# Builds LUFS Lab for Windows, macOS (Apple Silicon + Intel) and Linux on GitHub's servers,
# so you do not need each kind of computer. Put this folder in a GitHub repository, then:
#   Actions tab > "Build LUFS Lab" > Run workflow  -> download the files from the finished run.
name: Build LUFS Lab
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Grant permissions needed to create a GitHub Release
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: .\build_exe.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with: { name: LUFS-Lab-windows, path: dist/LUFS-Lab.exe }

  macos:
    strategy:
      matrix:
        include:
          - { os: macos-15,       name: apple-silicon }
          - { os: macos-15-intel, name: intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: chmod +x *.sh && ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: "LUFS-Lab-mac-${{ matrix.name }}", path: "dist/LUFS-Lab-mac-*.zip" }

  linux:
    runs-on: ubuntu-22.04        # older on purpose: the result then runs on newer distros too
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - run: chmod +x *.sh && ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: LUFS-Lab-linux, path: "dist/LUFS-Lab-*.AppImage" }

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux] # Wait for all builds to finish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloads all files uploaded via actions/upload-artifact
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      # Flattens the downloaded directory structure for the release upload
      - name: Prepare assets for release
        run: |
          mkdir -p final-assets
          find release-artifacts -type f -exec cp {} final-assets/ \;
          ls -l final-assets/

      # Creates the release and attaches the assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'manual-build' }}
          name: "Release ${{ github.ref_name || 'Manual Build' }}"
          draft: false
          prerelease: false
          files: final-assets/*
